  <section class="section page-top" id="reservar" aria-labelledby="book-t">
    <div class="wrap book-grid">
      <div>
        <h1 class="h-display h2" id="book-t" data-i18n="book_t">Reserva tu mesa</h1>
        <p class="lede" data-i18n="book_sub">Elige día y hora. Se abrirá WhatsApp con la reserva escrita; envíala y te confirmamos la mesa.</p>
        <a class="book-phone" href="tel:+34647306534">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><use href="#i-phone"/></svg>
          647 306 534
        </a>
        <p class="help help-after" data-i18n="big_group">Grupos de más de 12 personas: llámanos.</p>
      </div>
      <form class="form" id="book-form" novalidate>
        <div class="form-row">
          <div class="field">
            <label for="b-name" data-i18n="f_name">Nombre</label>
            <input class="input" id="b-name" name="name" autocomplete="name" required aria-describedby="b-name-err">
            <p class="err" id="b-name-err" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="b-phone" data-i18n="f_phone">Teléfono</label>
            <input class="input" id="b-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required aria-describedby="b-phone-err">
            <p class="err" id="b-phone-err" aria-live="polite"></p>
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="b-date" data-i18n="f_date">Fecha</label>
            <input class="input" id="b-date" name="date" type="date" required aria-describedby="b-date-err">
            <p class="err" id="b-date-err" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="b-time" data-i18n="f_time">Hora</label>
            <select class="input" id="b-time" name="time" required disabled aria-describedby="b-time-help b-time-err"></select>
            <p class="help" id="b-time-help" data-i18n="pick_date_first">Elige primero la fecha.</p>
            <p class="err" id="b-time-err" aria-live="polite"></p>
          </div>
        </div>
        <div class="field">
          <label for="b-people" data-i18n="f_people">Personas</label>
          <select class="input" id="b-people" name="people"></select>
        </div>
        <div class="field">
          <label for="b-notes"><span data-i18n="f_notes">Comentarios</span> <span class="opt" data-i18n="optional">(opcional)</span></label>
          <textarea class="input" id="b-notes" name="notes" data-i18n-ph="notes_ph" placeholder="Alergias, trona para bebé, una celebración…"></textarea>
        </div>
        <button class="btn btn-gold btn-block" type="submit">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.8-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.7a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.2-.2-.4-.3z"/></svg>
          <span data-i18n="book_submit">Enviar reserva por WhatsApp</span>
        </button>
        <p class="notice" id="book-ok" role="status" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path pathLength="1" d="M5 12.5l4.5 4.5L19 7.5"/></svg>
          <span data-i18n="book_ok">Hemos abierto WhatsApp con tu reserva. Envía el mensaje y te confirmamos la mesa.</span>
        </p>
      </form>
    </div>
  </section>
